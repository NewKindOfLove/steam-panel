<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container { padding: 15px; display: none; }
        .active-view { display: block; }
        
        /* Верхняя панель */
        .top-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .top-bar input {
            flex-grow: 1; padding: 10px; border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #7f91a4);
            outline: none;
        }
        .sq-btn {
            width: 42px; height: 42px; border-radius: 8px; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer;
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .sq-btn:active { opacity: 0.8; }
        .btn-secondary { background-color: var(--tg-theme-secondary-bg-color, #242f3d); color: var(--tg-theme-text-color); }
        .btn-danger { background-color: #e53935; color: white; }

        /* Список пользователей */
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-item {
            display: flex; align-items: center; padding: 10px;
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            border-radius: 10px; cursor: pointer; position: relative;
        }
        .user-item:active { opacity: 0.7; }
        
        .avatar-container { position: relative; margin-right: 15px; }
        .avatar-small { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; display: block; }
        .status-badge {
            position: absolute; bottom: 0; right: 0;
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid var(--tg-theme-secondary-bg-color, #242f3d);
            display: none;
        }
        .bg-online { background-color: #4CAF50; display: block; }
        .bg-ingame { background-color: #2196F3; display: block; }
        .bg-away { background-color: #FFC107; display: block; }

        .user-info-short { flex-grow: 1; }
        .user-name { font-weight: bold; font-size: 16px; margin: 0; }
        .bell-icon { font-size: 18px; padding: 5px; cursor: pointer; }

        /* Детальная карточка */
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .card-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
        .avatar-big { 
            width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px; 
            border: 3px solid var(--tg-theme-button-color, #5288c1); object-fit: cover;
        }
        .card-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        
        .card-stats { background-color: var(--tg-theme-secondary-bg-color, #242f3d); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-value { font-weight: bold; }
        
        textarea {
            width: 100%; box-sizing: border-box; padding: 10px;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #7f91a4);
            border-radius: 8px; min-height: 80px; resize: none; font-family: inherit; margin-bottom: 15px;
        }

        /* Настройки */
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            padding: 15px; border-radius: 10px; margin-bottom: 15px;
        }
        .switch { position: relative; display: inline-block; width: 40px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--tg-theme-button-color, #5288c1); }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Toast Уведомления */
        #toast {
            visibility: hidden; min-width: 200px;
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
            text-align: center; border-radius: 8px; padding: 12px;
            position: fixed; z-index: 1000; left: 50%; bottom: 20px;
            transform: translateX(-50%);
            font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show { visibility: visible; opacity: 1; bottom: 30px; }
    </style>
</head>
<body>
    <!-- Всплывающее уведомление -->
    <div id="toast">Уведомление</div>

    <!-- СПИСОК -->
    <div class="container active-view" id="list-view">
        <div class="top-bar">
            <input type="text" id="new-user-input" placeholder="ID или ссылка (жми Enter)">
            <button class="sq-btn" onclick="refreshPanel()">🔄</button>
            <button class="sq-btn btn-secondary" onclick="openSettings()">⚙️</button>
        </div>
        <div class="user-list" id="users-container"></div>
    </div>

    <!-- КАРТОЧКА -->
    <div class="container" id="detail-view">
        <div class="nav-bar">
            <button class="sq-btn btn-secondary" onclick="showList()">◀</button>
            <button class="sq-btn btn-danger" onclick="deleteUser()">🗑</button>
        </div>
        <div class="card-header">
            <a id="detail-link" href="#" target="_blank">
                <img id="detail-avatar" class="avatar-big" src="" alt="Avatar">
            </a>
            <div class="card-name" id="detail-name">Имя</div>
            <div style="font-size: 14px; color: var(--tg-theme-hint-color);">ID: <span id="detail-id"></span></div>
        </div>
        
        <div class="card-stats">
            <div class="stat-row"><span>Статус:</span> <span class="stat-value" id="detail-status"></span></div>
            <div class="stat-row"><span>Часов в CS:</span> <span class="stat-value" id="detail-hours"></span></div>
            <div class="stat-row"><span>Инвентарь:</span> <span class="stat-value" id="detail-inv"></span></div>
        </div>

        <div>
            <label style="display:block; margin-bottom:5px; font-weight:bold;">
                Примечание: 
                <span style="font-size:12px; font-weight:normal; color:var(--tg-theme-hint-color);">(Enter для сохранения)</span>
            </label>
            <textarea id="detail-note" placeholder="Введи заметку..."></textarea>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="container" id="settings-view">
        <div class="nav-bar">
            <button class="sq-btn btn-secondary" onclick="showList()">◀</button>
            <h3 style="margin:0; align-self:center;">Настройки</h3>
            <div style="width:42px;"></div>
        </div>
        <div class="setting-row">
            <span>Показывать колокольчики</span>
            <label class="switch">
                <input type="checkbox" id="toggle-bells" onchange="saveSettings()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUser = null;
        let usersData = [];
        let showBells = localStorage.getItem('showBells') !== 'false';
        document.getElementById('toggle-bells').checked = showBells;

        // Показ уведомления снизу
        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('d');
        
        if (encodedData) {
            try {
                const decoded = decodeURIComponent(escape(window.atob(encodedData)));
                usersData = JSON.parse(decoded);
                renderList();
            } catch (e) {
                document.getElementById('users-container').innerHTML = "Ошибка загрузки данных.";
            }
        } else {
            document.getElementById('users-container').innerHTML = "База пуста.";
        }

        function getStatusClass(user) {
            if (user.game) return "bg-ingame";
            if (user.status === 1) return "bg-online";
            if (user.status === 3 || user.status === 4) return "bg-away";
            return "";
        }

        function getStatusTextDetail(user) {
            if (user.game) return "🎮 " + user.game;
            if (user.status === 1) return "🟢 В сети";
            if (user.status === 0) return "🔴 Оффлайн";
            return "🟡 Отошел";
        }

        function renderList() {
            const container = document.getElementById('users-container');
            container.innerHTML = '';
            
            usersData.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-item';
                
                const badgeClass = getStatusClass(user);
                let bellHtml = showBells ? `<div class="bell-icon" onclick="toggleNotif(event, '${user.id}')">${user.notif ? '🔔' : '🔕'}</div>` : '';

                item.innerHTML = `
                    <div class="avatar-container" onclick="showDetail('${user.id}')">
                        <img class="avatar-small" src="${user.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/'}">
                        <div class="status-badge ${badgeClass}"></div>
                    </div>
                    <div class="user-info-short" onclick="showDetail('${user.id}')">
                        <div class="user-name">${user.name}</div>
                    </div>
                    ${bellHtml}
                `;
                container.appendChild(item);
            });
        }

        function switchView(viewId) {
            document.getElementById('list-view').classList.remove('active-view');
            document.getElementById('detail-view').classList.remove('active-view');
            document.getElementById('settings-view').classList.remove('active-view');
            document.getElementById(viewId).classList.add('active-view');
        }

        function showList() { switchView('list-view'); currentUser = null; }
        function openSettings() { switchView('settings-view'); }

        function showDetail(id) {
            currentUser = usersData.find(u => u.id === id);
            switchView('detail-view');
            
            document.getElementById('detail-avatar').src = currentUser.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/';
            document.getElementById('detail-link').href = currentUser.url;
            document.getElementById('detail-name').innerText = currentUser.name;
            document.getElementById('detail-id').innerText = currentUser.id;
            
            document.getElementById('detail-status').innerHTML = getStatusTextDetail(currentUser);
            document.getElementById('detail-hours').innerText = currentUser.hours;
            document.getElementById('detail-inv').innerText = currentUser.inv;
            document.getElementById('detail-note').value = currentUser.note;
        }

        function saveSettings() {
            showBells = document.getElementById('toggle-bells').checked;
            localStorage.setItem('showBells', showBells);
            renderList();
        }

        // --- Взаимодействие и обработка Enter ---

        document.getElementById("new-user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                addUser();
            }
        });

        document.getElementById("detail-note").addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                saveNote();
            }
        });

        function refreshPanel() {
            showToast("Обновление...");
            tg.sendData(JSON.stringify({ action: "refresh" }));
            tg.close();
        }

        function toggleNotif(event, id) {
            event.stopPropagation(); 
            tg.sendData(JSON.stringify({ action: "toggle_notif", steam_id: id }));
            tg.close();
        }

        function addUser() {
            const input = document.getElementById('new-user-input').value.trim();
            if (!input) return showToast("Введите Steam ID или ссылку!");
            showToast("Добавление...");
            tg.sendData(JSON.stringify({ action: "add_user", url: input }));
            tg.close();
        }

        function saveNote() {
            if (!currentUser) return;
            showToast("Сохранение...");
            tg.sendData(JSON.stringify({ action: "update_note", steam_id: currentUser.id, note: document.getElementById('detail-note').value }));
            tg.close();
        }

        function deleteUser() {
            if (!currentUser) return;
            tg.showConfirm("Удалить пользователя из базы?", function(passed) {
                if (passed) {
                    tg.sendData(JSON.stringify({ action: "delete", steam_id: currentUser.id }));
                    tg.close();
                }
            });
        }
    </script>
</body>
</html>
