<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steam Panel</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Подстраиваемся под цвета темы Телеграма */
        body {
            background-color: var(--tg-theme-secondary-bg-color, #1c1c1d);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }

        /* Поисковая строка */
        .search-container {
            background-color: var(--tg-theme-bg-color, #2c2c2e);
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        .search-container input {
            background: transparent;
            border: none;
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-left: 10px;
        }
        .search-container input::placeholder {
            color: var(--tg-theme-hint-color, #8e8e93);
        }

        /* Заголовок секции */
        h2 {
            font-size: 18px;
            margin: 0 0 10px 10px;
            font-weight: 600;
        }

        /* Список профилей */
        .list-box {
            background-color: var(--tg-theme-bg-color, #2c2c2e);
            border-radius: 12px;
            overflow: hidden;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #1c1c1d);
            cursor: pointer;
            transition: background 0.2s;
        }
        .list-item:active {
            background-color: var(--tg-theme-secondary-bg-color, #1c1c1d);
        }
        .list-item:last-child {
            border-bottom: none;
        }

        /* Иконки и аватарки */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }
        .icon-add {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: transparent;
            color: var(--tg-theme-link-color, #0a84ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-right: 15px;
        }

        /* Текст внутри элементов списка */
        .item-info {
            flex-grow: 1;
        }
        .item-title {
            font-size: 16px;
            font-weight: 500;
        }
        .item-subtitle {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #8e8e93);
            margin-top: 2px;
        }
        .add-text {
            color: var(--tg-theme-link-color, #0a84ff);
            font-size: 16px;
            font-weight: 500;
        }
        .arrow {
            color: var(--tg-theme-hint-color, #8e8e93);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Поисковик -->
    <div class="search-container">
        <span style="color: var(--tg-theme-hint-color);">🔍</span>
        <input type="text" placeholder="Search profiles...">
    </div>

    <h2>Мои типы</h2>

    <!-- Контейнер с карточками -->
    <div class="list-box">
        
        <!-- Кнопка добавления -->
        <div class="list-item" onclick="addNew()">
            <div class="icon-add">⊕</div>
            <div class="item-info">
                <div class="add-text">Add a New Profile</div>
            </div>
        </div>

        <!-- Пример 1: Игрок -->
        <div class="list-item" onclick="openProfile('76561198192868411')">
            <img class="avatar" src="https://store.cloudflare.steamstatic.com/public/shared/images/responsive/share_steam_logo.png" alt="Avatar">
            <div class="item-info">
                <div class="item-title">$.U.G.R.O.B.</div>
                <div class="item-subtitle">76561198192868411</div>
            </div>
            <div class="arrow">›</div>
        </div>

        <!-- Пример 2: Игрок -->
        <div class="list-item" onclick="openProfile('76561199581373731')">
            <img class="avatar" src="https://store.cloudflare.steamstatic.com/public/shared/images/responsive/share_steam_logo.png" alt="Avatar">
            <div class="item-info">
                <div class="item-title">Скрытый профиль</div>
                <div class="item-subtitle">76561199581373731</div>
            </div>
            <div class="arrow">›</div>
        </div>

    </div>

    <script>
        // Инициализируем Telegram Web App API
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открываем панель на всю доступную высоту

        function openProfile(steamId) {
            // Копируем ID в буфер обмена
            navigator.clipboard.writeText(steamId);
            
            // Встроенное уведомление Телеграма
            tg.showAlert("ID " + steamId + " скопирован!\n\nСейчас откроем профиль Steam.");
            
            // Открываем профиль в браузере
            setTimeout(() => {
                tg.openLink("https://steamcommunity.com/profiles/" + steamId);
            }, 1500);
        }

        function addNew() {
            tg.showConfirm("Хочешь добавить новый профиль? Отправь ссылку боту в чат!", function(confirmed) {
                if (confirmed) {
                    tg.close(); // Закрываем панель, чтобы юзер мог скинуть ссылку
                }
            });
        }
    </script>
</body>
</html>
