<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        .container { padding: 15px; display: none; } .active-view { display: block; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .top-bar input { flex-grow: 1; padding: 10px; border-radius: 8px; background-color: var(--tg-theme-secondary-bg-color, #242f3d); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); outline: none; }
        .sq-btn { width: 42px; height: 42px; border-radius: 8px; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; background-color: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #ffffff); }
        .sq-btn:active { opacity: 0.8; } .btn-secondary { background-color: var(--tg-theme-secondary-bg-color, #242f3d); color: var(--tg-theme-text-color); } .btn-danger { background-color: #e53935; color: white; }
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-item { display: flex; align-items: center; padding: 10px; background-color: var(--tg-theme-secondary-bg-color, #242f3d); border-radius: 10px; cursor: pointer; position: relative; }
        .avatar-container { position: relative; margin-right: 15px; }
        .avatar-small { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .status-badge { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tg-theme-secondary-bg-color, #242f3d); display: none; }
        .bg-online { background-color: #4CAF50; display: block; } .bg-ingame { background-color: #2196F3; display: block; } .bg-away { background-color: #FFC107; display: block; }
        .user-info-short { flex-grow: 1; font-weight: bold; font-size: 16px; } .bell-icon { font-size: 18px; padding: 5px; cursor: pointer; }
        
        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .card-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
        .avatar-big { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px; border: 3px solid var(--tg-theme-button-color, #5288c1); object-fit: cover; }
        .card-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .card-stats { background-color: var(--tg-theme-secondary-bg-color, #242f3d); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center;} .stat-row:last-child { margin-bottom: 0; } .stat-value { font-weight: bold; }
        
        select { background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); border-radius: 5px; padding: 5px; outline: none; font-weight: bold;}
        .tradeban-input { display: none; width: 60px; padding: 5px; border-radius: 5px; background-color: var(--tg-theme-bg-color, #17212b); color: white; border: 1px solid var(--tg-theme-hint-color, #7f91a4); margin-left: 5px; outline: none; text-align: center;}

        textarea { width: 100%; box-sizing: border-box; padding: 10px; background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); border-radius: 8px; min-height: 80px; resize: none; font-family: inherit; margin-bottom: 15px; }
        .logs-section { background-color: var(--tg-theme-secondary-bg-color, #242f3d); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .log-item { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .log-inputs { display: flex; gap: 5px; margin-top: 10px; }
        .log-inputs input { flex: 1; padding: 8px; border-radius: 8px; background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); outline: none;}
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; background-color: var(--tg-theme-secondary-bg-color, #242f3d); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 24px; } .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--tg-theme-button-color, #5288c1); } input:checked + .slider:before { transform: translateX(16px); }
        #toast { visibility: hidden; min-width: 200px; background-color: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #ffffff); text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 1000; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 30px; }
    </style>
</head>
<body>
    <div id="toast">Уведомление</div>

    <!-- СПИСОК -->
    <div class="container active-view" id="list-view">
        <div class="top-bar">
            <input type="text" id="new-user-input" placeholder="Поиск или Steam ссылка (Enter)">
            <button class="sq-btn" onclick="manualRefresh()">🔄</button>
            <button class="sq-btn btn-secondary" onclick="openSettings()">⚙️</button>
        </div>
        <div class="user-list" id="users-container">Ожидание данных...</div>
    </div>

    <!-- КАРТОЧКА -->
    <div class="container" id="detail-view">
        <div class="nav-bar">
            <button class="sq-btn btn-secondary" onclick="showList()">◀</button>
            <button class="sq-btn btn-danger" onclick="deleteUser()">🗑</button>
        </div>
        <div class="card-header">
            <a id="detail-link" href="#" target="_blank"><img id="detail-avatar" class="avatar-big" src=""></a>
            <div class="card-name" id="detail-name">Имя</div>
            <div style="font-size: 14px; color: var(--tg-theme-hint-color);">ID: <span id="detail-id"></span></div>
        </div>
        
        <div class="card-stats">
            <div class="stat-row"><span>Статус:</span> <span class="stat-value" id="detail-status"></span></div>
            <div class="stat-row"><span>Часов в CS:</span> <span class="stat-value" id="detail-hours"></span></div>
            <div class="stat-row"><span>Инвентарь:</span> <span class="stat-value" id="detail-inv"></span></div>
            <div class="stat-row">
                <span>Досье:</span>
                <div style="display:flex; align-items:center;">
                    <select id="tradeban-select" onchange="handleTradebanChange()">
                        <option value="none">Обычный</option>
                        <option value="ban">Трейдбан</option>
                        <option value="ready">Можно снимать</option>
                        <option value="vac">Снят + ВАК</option>
                        <option value="work">Снят + Ведение</option>
                    </select>
                    <input type="number" id="tradeban-days" class="tradeban-input" placeholder="Дней">
                </div>
            </div>
        </div>

        <div class="logs-section">
            <h4 style="margin-top:0; margin-bottom:10px;">💸 Логи (В холде)</h4>
            <div id="detail-logs-list"></div>
            <div class="log-inputs">
                <input type="text" id="log-amount" placeholder="Сумма ($/₽)">
                <input type="number" id="log-days" placeholder="Дней">
                <button class="sq-btn" style="width: auto; padding: 0 15px;" onclick="addLog()">➕</button>
            </div>
        </div>

        <div>
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Примечание: <span style="font-size:12px; font-weight:normal;">(Enter для сохр.)</span></label>
            <textarea id="detail-note" placeholder="Введи заметку..."></textarea>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="container" id="settings-view">
        <div class="nav-bar">
            <button class="sq-btn btn-secondary" onclick="showList()">◀</button>
            <h3 style="margin:0; align-self:center;">Настройки</h3>
            <div style="width:42px;"></div>
        </div>
        <div class="setting-row">
            <span>Колокольчики</span>
            <label class="switch"><input type="checkbox" id="toggle-bells" onchange="saveSettings()"><span class="slider"></span></label>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUser = null;
        let usersData = [];
        let showBells = localStorage.getItem('showBells') !== 'false';
        document.getElementById('toggle-bells').checked = showBells;

        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('t');
        const DB_PATH = urlParams.get('d');
        const CMD_PATH = urlParams.get('c');

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg; toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }

        async function fetchLiveDB(manual = false) {
            if (!DB_PATH) return;
            try {
                const r = await fetch(`https://api.telegra.ph/getPage/${DB_PATH}?return_content=true&_=${Date.now()}`);
                const data = await r.json();
                let jsonStr = "";
                const nodes = data.result.content;
                if (nodes && nodes.length > 0 && nodes[0].children) {
                    for (let c of nodes[0].children) if (typeof c === 'string') jsonStr += c;
                }
                usersData = JSON.parse(jsonStr || "[]");
                
                // Применяем фильтр поиска, если мы в списке
                if(document.getElementById('list-view').classList.contains('active-view')) {
                    filterList(); 
                } else if (currentUser) {
                    showDetail(currentUser.id, true);
                }
                if (manual) showToast("Данные обновлены ✅");
            } catch(e) {}
        }

        setInterval(fetchLiveDB, 3000);
        fetchLiveDB();

        function manualRefresh() {
            document.getElementById('new-user-input').value = ""; // очищаем поиск
            fetchLiveDB(true);
        }

        async function sendSilentCommand(cmdObj) {
            showToast("Сохранение...");
            try {
                const r = await fetch(`https://api.telegra.ph/getPage/${CMD_PATH}?return_content=true&_=${Date.now()}`);
                const data = await r.json();
                let jsonStr = "";
                const nodes = data.result.content;
                if (nodes && nodes.length > 0 && nodes[0].children) {
                    for (let c of nodes[0].children) if (typeof c === 'string') jsonStr += c;
                }
                let cmds = [];
                try { cmds = JSON.parse(jsonStr || "[]"); } catch(e){}
                
                cmds.push(cmdObj);
                
                const newStr = JSON.stringify(cmds);
                let chunks = [];
                for(let i=0; i<newStr.length; i+=4000) chunks.push(newStr.slice(i, i+4000));
                
                const formData = new FormData();
                formData.append("access_token", TOKEN);
                formData.append("title", "CMD");
                formData.append("content", JSON.stringify([{"tag":"p", "children": chunks.length ? chunks : ["[]"]}]));
                
                await fetch(`https://api.telegra.ph/editPage/${CMD_PATH}`, { method: "POST", body: formData });
                setTimeout(fetchLiveDB, 1500);
            } catch(e) { showToast("Ошибка сети"); }
        }

        function getStatusClass(u) { return u.game ? "bg-ingame" : (u.status === 1 ? "bg-online" : (u.status === 3 || u.status === 4 ? "bg-away" : "")); }
        function getStatusText(u) { return u.game ? "🎮 " + u.game : (u.status === 1 ? "🟢 В сети" : (u.status === 0 ? "🔴 Оффлайн" : "🟡 Отошел")); }

        function renderList(filteredData = usersData) {
            const container = document.getElementById('users-container'); container.innerHTML = '';
            filteredData.forEach(user => {
                const item = document.createElement('div'); item.className = 'user-item';
                let bell = showBells ? `<div class="bell-icon" onclick="toggleNotif(event, '${user.id}')">${user.notif ? '🔔' : '🔕'}</div>` : '';
                
                // Значок трейдбана рядом с именем
                let tbIcon = "";
                if(user.tb_status === "ban") tbIcon = " ⏳";
                if(user.tb_status === "ready") tbIcon = " ✅";
                if(user.tb_status === "vac") tbIcon = " 💀";
                if(user.tb_status === "work") tbIcon = " 💼";

                item.innerHTML = `
                    <div class="avatar-container" onclick="showDetail('${user.id}')">
                        <img class="avatar-small" src="${user.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/'}">
                        <div class="status-badge ${getStatusClass(user)}"></div>
                    </div>
                    <div class="user-info-short" onclick="showDetail('${user.id}')">${user.name}${tbIcon}</div>
                    ${bell}
                `;
                container.appendChild(item);
            });
        }

        // --- ПОИСК И ДОБАВЛЕНИЕ ---
        function filterList() {
            const query = document.getElementById('new-user-input').value.trim().toLowerCase();
            if (!query) {
                renderList(usersData);
                return;
            }
            const filtered = usersData.filter(u => u.name.toLowerCase().includes(query) || u.id.includes(query));
            renderList(filtered);
        }

        document.getElementById("new-user-input").addEventListener("input", filterList);
        
        document.getElementById("new-user-input").addEventListener("keydown", e => { 
            if (e.key === "Enter") {
                const input = document.getElementById('new-user-input').value.trim();
                if (!input) return;
                
                // Если это не похоже на ID или ссылку - выдаем ошибку (Защита от "слон")
                const isSteam = input.includes("steamcommunity.com") || /^\d{17}$/.test(input);
                if (!isSteam) {
                    showToast("❌ Введи Steam ссылку или ID64 для добавления!");
                    return;
                }

                sendSilentCommand({ action: "add_user", url: input });
                showToast("Добавляю... Панель закроется."); 
                document.getElementById('new-user-input').value = "";
                setTimeout(() => tg.close(), 1000);
            }
        });

        // --- ДОСЬЕ И ТРЕЙДБАН ---
        function handleTradebanChange() {
            const val = document.getElementById('tradeban-select').value;
            const daysInput = document.getElementById('tradeban-days');
            
            if (val === 'ban') {
                daysInput.style.display = 'block';
                daysInput.focus();
            } else {
                daysInput.style.display = 'none';
                daysInput.value = '';
                saveTradeban(val, 0);
            }
        }

        document.getElementById("tradeban-days").addEventListener("keydown", e => { 
            if (e.key === "Enter") {
                const days = parseInt(document.getElementById('tradeban-days').value);
                if(isNaN(days) || days <= 0) return showToast("Введи количество дней!");
                saveTradeban('ban', days);
            }
        });

        function saveTradeban(status, days) {
            if (!currentUser) return;
            const unlockTime = days > 0 ? Math.floor(Date.now() / 1000) + (days * 86400) : 0;
            
            // Локальное обновление
            currentUser.tb_status = status;
            currentUser.tb_time = unlockTime;
            
            sendSilentCommand({ 
                action: "update_tradeban", 
                steam_id: currentUser.id, 
                tb_status: status, 
                tb_time: unlockTime 
            });
            showToast("Досье обновлено ✅");
        }


        function switchView(id) {
            ['list-view', 'detail-view', 'settings-view'].forEach(v => document.getElementById(v).classList.remove('active-view'));
            document.getElementById(id).classList.add('active-view');
        }
        function showList() { switchView('list-view'); currentUser = null; document.getElementById('new-user-input').value = ""; filterList();}
        function openSettings() { switchView('settings-view'); }

        function renderLogs() {
            const list = document.getElementById('detail-logs-list'); list.innerHTML = '';
            if(!currentUser.logs || currentUser.logs.length === 0) { list.innerHTML = '<div style="color:#7f91a4; font-size:14px;">Нет логов в холде</div>'; return; }
            const now = Math.floor(Date.now() / 1000);
            currentUser.logs.forEach(log => {
                let daysLeft = Math.ceil((log.unlock_time - now) / 86400);
                list.innerHTML += `<div class="log-item"><span>💰 ${log.amount}</span><span>Осталось: ${daysLeft > 0 ? daysLeft : 0} дн.</span></div>`;
            });
        }

        function showDetail(id, silentUpdate = false) {
            currentUser = usersData.find(u => u.id === id); 
            if(!currentUser) return showList();
            if(!silentUpdate) switchView('detail-view');
            
            document.getElementById('detail-avatar').src = currentUser.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/';
            document.getElementById('detail-link').href = currentUser.url;
            document.getElementById('detail-name').innerText = currentUser.name;
            document.getElementById('detail-id').innerText = currentUser.id;
            document.getElementById('detail-status').innerHTML = getStatusText(currentUser);
            document.getElementById('detail-hours').innerText = currentUser.hours;
            document.getElementById('detail-inv').innerText = currentUser.inv;
            
            // Настройка дропдауна
            const sel = document.getElementById('tradeban-select');
            const inp = document.getElementById('tradeban-days');
            sel.value = currentUser.tb_status || "none";
            
            if (sel.value === "ban" && currentUser.tb_time) {
                inp.style.display = 'block';
                const daysLeft = Math.ceil((currentUser.tb_time - Math.floor(Date.now() / 1000)) / 86400);
                if(!silentUpdate) inp.value = daysLeft > 0 ? daysLeft : 0;
            } else {
                inp.style.display = 'none';
                if(!silentUpdate) inp.value = "";
            }

            if(!silentUpdate) document.getElementById('detail-note').value = currentUser.note;
            renderLogs();
        }

        function saveSettings() { showBells = document.getElementById('toggle-bells').checked; localStorage.setItem('showBells', showBells); filterList(); }

        document.getElementById("detail-note").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNote(); } });
        document.getElementById("log-amount").addEventListener("keydown", e => { if (e.key === "Enter") addLog(); });
        document.getElementById("log-days").addEventListener("keydown", e => { if (e.key === "Enter") addLog(); });

        function toggleNotif(event, id) {
            event.stopPropagation();
            let user = usersData.find(u => u.id === id); user.notif = user.notif ? 0 : 1;
            filterList(); sendSilentCommand({ action: "toggle_notif", steam_id: id });
            showToast(user.notif ? "Уведомления включены" : "Уведомления отключены");
        }

        function saveNote() {
            if (!currentUser) return;
            currentUser.note = document.getElementById('detail-note').value;
            sendSilentCommand({ action: "update_note", steam_id: currentUser.id, note: currentUser.note });
            showToast("Примечание сохранено ✅");
        }

        function addLog() {
            if (!currentUser) return;
            const amount = document.getElementById('log-amount').value.trim();
            const days = parseInt(document.getElementById('log-days').value);
            if (!amount || isNaN(days)) return showToast("Введи сумму и дни!");
            
            const unlockTime = Math.floor(Date.now() / 1000) + (days * 86400);
            if(!currentUser.logs) currentUser.logs = [];
            currentUser.logs.push({ amount, unlock_time: unlockTime });
            renderLogs();
            
            sendSilentCommand({ action: "add_log", steam_id: currentUser.id, amount, unlock_time: unlockTime });
            document.getElementById('log-amount').value = ''; document.getElementById('log-days').value = '';
            showToast("Лог поставлен ✅");
        }

        function deleteUser() {
            if (!currentUser) return;
            tg.showConfirm("Удалить пользователя из базы?", passed => {
                if (passed) {
                    sendSilentCommand({ action: "delete", steam_id: currentUser.id });
                    usersData = usersData.filter(u => u.id !== currentUser.id);
                    filterList(); showList(); showToast("Пользователь удален!");
                }
            });
        }
    </script>
</body>
</html>
