<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Запрет кэширования -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Steam Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-secondary-bg-color, #1c1c1d);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 16px; overflow-x: hidden;
        }

        /* --- СПИСОК --- */
        #page-list { transition: opacity 0.3s; }
        .search-container {
            background-color: var(--tg-theme-bg-color, #2c2c2e);
            border-radius: 10px; padding: 10px 15px;
            display: flex; align-items: center; margin-bottom: 24px;
        }
        .search-container input {
            background: transparent; border: none;
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px; width: 100%; outline: none; margin-left: 10px;
        }
        h2 { font-size: 18px; margin: 0 0 10px 10px; font-weight: 600; }
        .list-box {
            background-color: var(--tg-theme-bg-color, #2c2c2e);
            border-radius: 12px; overflow: hidden;
        }
        .list-item {
            display: flex; align-items: center; padding: 12px 16px;
            border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #1c1c1d);
            cursor: pointer;
        }
        .list-item:active { background-color: var(--tg-theme-secondary-bg-color, #1c1c1d); }
        .list-item:last-child { border-bottom: none; }

        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            margin-right: 15px; object-fit: cover;
            background-color: #333;
        }
        .icon-add {
            width: 42px; height: 42px; border-radius: 50%;
            color: var(--tg-theme-link-color, #0a84ff);
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; margin-right: 15px;
        }
        .item-info { flex-grow: 1; }
        .item-title { font-size: 16px; font-weight: 500; }
        .item-subtitle { font-size: 13px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 2px; }
        .add-text { color: var(--tg-theme-link-color, #0a84ff); font-size: 16px; font-weight: 500; }
        .arrow { color: var(--tg-theme-hint-color, #8e8e93); font-weight: bold; }

        /* --- ДОСЬЕ --- */
        #page-dossier { display: none; text-align: center; animation: slideIn 0.3s forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .dossier-header { margin-top: 20px; margin-bottom: 30px; }
        .dossier-avatar {
            width: 120px; height: 120px; border-radius: 50%;
            object-fit: cover; margin-bottom: 15px;
            border: 3px solid var(--tg-theme-button-color, #2481cc);
        }
        .dossier-name { font-size: 24px; font-weight: bold; margin: 0; }
        .dossier-id { font-size: 14px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 5px; }

        .btn-main {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 10px; padding: 14px;
            font-size: 16px; font-weight: 600; width: 100%;
            cursor: pointer; margin-bottom: 20px;
        }
        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
        .feature-card { background-color: var(--tg-theme-bg-color, #2c2c2e); padding: 15px; border-radius: 12px; }
        .fc-title { font-size: 13px; color: var(--tg-theme-hint-color, #8e8e93); margin-bottom: 5px; }
        .fc-value { font-size: 15px; font-weight: 500; }
        .fc-locked { color: var(--tg-theme-hint-color, #8e8e93); font-style: italic; font-size: 13px;}
    </style>
</head>
<body>

    <!-- СПИСОК -->
    <div id="page-list">
        <div class="search-container">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Поиск по нику или ID...">
        </div>
        <h2>Мои типы</h2>
        <div class="list-box" id="profiles-list">
            <!-- Динамический список появится здесь -->
        </div>
    </div>

    <!-- ДОСЬЕ -->
    <div id="page-dossier">
        <div class="dossier-header">
            <!-- onerror спасет, если аватарка сломалась -->
            <img id="dos-avatar" class="dossier-avatar" src="" onerror="this.src='https://store.cloudflare.steamstatic.com/public/shared/images/responsive/share_steam_logo.png'" alt="Avatar">
            <h1 id="dos-name" class="dossier-name">Name</h1>
            <p id="dos-id" class="dossier-id">ID</p>
        </div>

        <button class="btn-main" onclick="openSteamLink()">🔗 Открыть профиль Steam</button>

        <div class="features-grid">
            <div class="feature-card" onclick="copyId()">
                <div class="fc-title">Steam ID</div>
                <div class="fc-value">Скопировать 📋</div>
            </div>
            <div class="feature-card">
                <div class="fc-title">VAC Бан</div>
                <div class="fc-value">Чист 🟢</div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentSteamId = "";

        const DEFAULT_IMG = "https://store.cloudflare.steamstatic.com/public/shared/images/responsive/share_steam_logo.png";

        // === Читаем базу данных из ссылки ===
        let profiles = [];
        const urlParams = new URLSearchParams(window.location.search);
        const dataB64 = urlParams.get('data');
        
        if (dataB64) {
            try {
                // Правильная расшифровка для поддержки русского языка
                const binaryString = atob(decodeURIComponent(dataB64));
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
                const decoder = new TextDecoder('utf-8');
                profiles = JSON.parse(decoder.decode(bytes));
            } catch(e) {
                console.error("Ошибка расшифровки данных", e);
            }
        }

        // === Отрисовка списка ===
        function renderList(filterText = "") {
            const listBox = document.getElementById('profiles-list');
            
            // Кнопка добавления всегда сверху
            listBox.innerHTML = `
                <div class="list-item" onclick="addNew()">
                    <div class="icon-add">⊕</div>
                    <div class="item-info"><div class="add-text">Добавить профиль</div></div>
                </div>
            `;

            // Фильтруем и выводим профили
            profiles.forEach(p => {
                if (filterText && !p.nickname.toLowerCase().includes(filterText) && !p.steam_id.includes(filterText)) {
                    return; // Пропускаем, если не подходит под поиск
                }
                
                // Спасательный круг для аватарки: атрибут onerror подменяет битую картинку на логотип Steam
                const html = `
                <div class="list-item" onclick="openDossier('${p.steam_id}', '${p.nickname}', '${p.avatar}')">
                    <img class="avatar" src="${p.avatar}" onerror="this.src='${DEFAULT_IMG}'" alt="Avatar">
                    <div class="item-info">
                        <div class="item-title">${p.nickname}</div>
                        <div class="item-subtitle">${p.steam_id}</div>
                    </div>
                    <div class="arrow">›</div>
                </div>`;
                listBox.insertAdjacentHTML('beforeend', html);
            });
        }

        // Запуск отрисовки
        renderList();

        // Живой поиск
        document.getElementById('searchInput').addEventListener('input', function(e) {
            renderList(e.target.value.toLowerCase());
        });

        // === Навигация и Досье ===
        tg.BackButton.onClick(function() {
            document.getElementById('page-dossier').style.display = 'none';
            document.getElementById('page-list').style.display = 'block';
            tg.BackButton.hide();
        });

        function openDossier(steamId, name, avatarUrl) {
            currentSteamId = steamId;
            document.getElementById('dos-avatar').src = avatarUrl;
            document.getElementById('dos-name').innerText = name;
            document.getElementById('dos-id').innerText = steamId;

            document.getElementById('page-list').style.display = 'none';
            document.getElementById('page-dossier').style.display = 'block';
            tg.BackButton.show();
        }

        function openSteamLink() { tg.openLink("https://steamcommunity.com/profiles/" + currentSteamId); }
        
        function copyId() {
            navigator.clipboard.writeText(currentSteamId);
            tg.showAlert("ID " + currentSteamId + " скопирован!");
        }

        function addNew() {
            tg.showConfirm("Добавить новый профиль? Отправь ссылку боту в чат!", function(confirmed) {
                if (confirmed) tg.close();
            });
        }
    </script>
</body>
</html>
