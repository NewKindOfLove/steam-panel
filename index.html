<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        .container { padding: 15px; display: none; } .active-view { display: block; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .top-bar input { flex-grow: 1; padding: 10px; border-radius: 8px; background-color: var(--tg-theme-secondary-bg-color, #242f3d); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); outline: none; }
        .sq-btn { width: 42px; height: 42px; border-radius: 8px; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; background-color: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #ffffff); }
        .sq-btn:active { opacity: 0.8; } .btn-secondary { background-color: var(--tg-theme-secondary-bg-color, #242f3d); color: var(--tg-theme-text-color); } .btn-danger { background-color: #e53935; color: white; }
        
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-item { display: flex; align-items: center; padding: 10px 10px 22px 10px; background-color: var(--tg-theme-secondary-bg-color, #242f3d); border-radius: 10px; cursor: pointer; position: relative; }
        .avatar-container { position: relative; margin-right: 15px; }
        .avatar-small { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        
        .status-badge { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--tg-theme-secondary-bg-color, #242f3d); display: none; }
        .bg-online { background-color: #4CAF50; display: block; } 
        .bg-ingame { background-color: #7FFF00; display: block; box-shadow: 0 0 8px #7FFF00;} 
        .bg-away { background-color: #FFC107; display: block; }
        
        .user-info-short { flex-grow: 1; font-weight: bold; font-size: 16px; margin-right: 30px;} 
        .bell-icon { font-size: 18px; padding: 5px; cursor: pointer; position: absolute; top: 8px; right: 8px; }
        
        .tb-status-text { position: absolute; bottom: 6px; right: 12px; font-size: 11px; font-weight: bold; letter-spacing: 0.3px; }
        .text-ready { color: #4CAF50; }
        .text-ban { color: #FF9800; }
        .text-unbanned { color: #39FF14; } 

        .nav-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .card-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
        .avatar-big { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px; border: 3px solid var(--tg-theme-button-color, #5288c1); object-fit: cover; }
        .card-name { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .card-id-text { font-size: 13px; color: var(--tg-theme-hint-color); margin-bottom: 3px; }

        .card-stats { background-color: var(--tg-theme-secondary-bg-color, #242f3d); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center;} .stat-row:last-child { margin-bottom: 0; } .stat-value { font-weight: bold; }
        
        select { background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); border-radius: 5px; padding: 5px; outline: none; font-weight: bold; font-size: 14px;}
        .date-sel { width: 55px; text-align: center; }
        .tradeban-input { width: 55px; padding: 5px; border-radius: 5px; background-color: var(--tg-theme-bg-color, #17212b); color: white; border: 1px solid var(--tg-theme-hint-color, #7f91a4); outline: none; text-align: center; font-size: 14px;}
        .snat-input { width: 75px; padding: 4px; border-radius: 5px; background-color: var(--tg-theme-bg-color, #17212b); color: white; border: 1px solid var(--tg-theme-hint-color, #7f91a4); outline: none; text-align: center; font-size: 14px;}
        
        input[type="time"]::-webkit-calendar-picker-indicator { display: none; -webkit-appearance: none; }
        input[type="time"] { -moz-appearance: textfield; }

        .param-box { background-color: var(--tg-theme-bg-color, #17212b); padding: 12px; border-radius: 8px; margin-top:10px; display:none; flex-direction:column; gap:12px; border: 1px solid #303f50; }
        .param-header { display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #303f50; padding-bottom: 8px; }
        .param-title { font-weight:bold; color:#5288c1; font-size:13px; max-width: 120px; line-height: 1.2; }
        
        .param-radios { font-size:12px; font-weight:bold; display: flex; gap: 10px; align-items: center;}
        .param-radios label { cursor:pointer; display: flex; align-items: center; gap: 4px;}
        .radio-snat { color: #4CAF50; }
        .radio-work { color: #FFC107; }
        .radio-vac { color: #F44336; }

        .param-inputs-wrap { display:flex; justify-content:flex-start; gap:10px; align-items:flex-end; }
        .input-group { display:flex; flex-direction:column; align-items:center; }
        .input-label { font-size:10px; color:#7f91a4; margin-bottom:4px; font-weight: bold; text-transform: uppercase; }

        textarea { width: 100%; box-sizing: border-box; padding: 10px; background-color: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #ffffff); border: 1px solid var(--tg-theme-hint-color, #7f91a4); border-radius: 8px; min-height: 80px; resize: none; font-family: inherit; margin-bottom: 15px; }
        
        .setting-row { display: flex; justify-content: space-between; align-items: center; background-color: var(--tg-theme-secondary-bg-color, #242f3d); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .switch { position: relative; display: inline-block; width: 40px; height: 24px; } .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--tg-theme-button-color, #5288c1); } input:checked + .slider:before { transform: translateX(16px); }
        
        #toast { visibility: hidden; min-width: 200px; background-color: var(--tg-theme-button-color, #5288c1); color: var(--tg-theme-button-text-color, #ffffff); text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 1000; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 14px; opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 30px; }
    </style>
</head>
<body>
    <div id="toast">Уведомление</div>

    <!-- СПИСОК -->
    <div class="container active-view" id="list-view">
        <div class="top-bar">
            <input type="text" id="new-user-input" placeholder="Поиск или Steam ссылка (Enter)">
            <button class="sq-btn" onclick="manualRefresh()">🔄</button>
            <button class="sq-btn btn-secondary" onclick="openSettings()">⚙️</button>
        </div>
        <div class="user-list" id="users-container">Ожидание данных...</div>
    </div>

    <!-- КАРТОЧКА -->
    <div class="container" id="detail-view">
        <div class="nav-bar">
            <button class="sq-btn btn-secondary" onclick="showList()">◀</button>
            <button class="sq-btn btn-danger" onclick="deleteUser()">🗑</button>
        </div>
        <div class="card-header">
            <a id="detail-link" href="#" target="_blank"><img id="detail-avatar" class="avatar-big" src=""></a>
            <div class="card-name" id="detail-name">Имя</div>
            <div class="card-id-text">ID: <span id="detail-id"></span> &nbsp;|&nbsp; Добавлен: <span id="detail-added-date" style="color:#a8b5c2;"></span></div>
        </div>
        
        <div class="card-stats">
            <div class="stat-row"><span>Статус:</span> <span class="stat-value" id="detail-status"></span></div>
            <div class="stat-row"><span>Часов в CS:</span> <span class="stat-value" id="detail-hours"></span></div>
            <div class="stat-row"><span>Инвентарь:</span> <span class="stat-value" id="detail-inv"></span></div>
            
            <div class="stat-row" style="margin-top: 10px;">
                <span>Параметр:</span>
                <div style="display:flex; align-items:center;">
                    <select id="tradeban-select" onchange="handleTradebanChange()">
                        <option value="none" style="display:none;">Нет статуса</option>
                        <option value="ban">Трейдбан</option>
                        <option value="ready">Можно снимать</option>
                        <option value="snat">Снят</option>
                        <option value="unbanned">Разбанился</option>
                    </select>
                </div>
            </div>
            
            <!-- Поля для Трейдбана -->
            <div id="ban-ui" class="param-box">
                <div class="param-header">
                    <span id="ban-hint" class="param-title">(точная дата конца тб:)</span>
                    <div class="param-radios">
                        <label><input type="radio" name="ban_type" value="ban_exact" checked onchange="toggleBanUI()"> Точная</label>
                        <label><input type="radio" name="ban_type" value="ban_approx" onchange="toggleBanUI()"> Примерная</label>
                    </div>
                </div>
                
                <div class="param-inputs-wrap" id="ban-exact-inputs">
                    <div class="input-group">
                        <span class="input-label">День</span>
                        <select id="ban-day" class="date-sel"></select>
                    </div>
                    <div class="input-group">
                        <span class="input-label">Месяц</span>
                        <select id="ban-month" class="date-sel"></select>
                    </div>
                    <div class="input-group" style="margin-left: 5px;">
                        <span class="input-label">Время</span>
                        <input type="time" id="ban-time" class="snat-input" step="60">
                    </div>
                    <button class="sq-btn" style="width: 32px; height: 32px; font-size: 14px; margin-bottom: 1px; margin-left:auto;" onclick="saveBanExact()">💾</button>
                </div>
                
                <div class="param-inputs-wrap" id="ban-approx-inputs" style="display:none;">
                    <div class="input-group">
                        <span class="input-label">Дней</span>
                        <select id="ban-days" class="date-sel" style="width: 60px;"></select>
                    </div>
                    <button class="sq-btn" style="width: 32px; height: 32px; font-size: 14px; margin-bottom: 1px; margin-left:auto;" onclick="saveBanApprox()">💾</button>
                </div>
            </div>

            <!-- Поля для Снятых -->
            <div id="snat-ui" class="param-box">
                <div class="param-header">
                    <span class="param-title">(время, когда тип был снят:)</span>
                    <div class="param-radios">
                        <label class="radio-snat"><input type="radio" name="snat_type" value="snat" checked> Снят</label>
                        <label class="radio-work"><input type="radio" name="snat_type" value="snat_work"> Ведение</label>
                        <label class="radio-vac"><input type="radio" name="snat_type" value="snat_vac"> ВАК</label>
                    </div>
                </div>
                <div class="param-inputs-wrap">
                    <div class="input-group">
                        <span class="input-label">День</span>
                        <select id="snat-day" class="date-sel"></select>
                    </div>
                    <div class="input-group">
                        <span class="input-label">Месяц</span>
                        <select id="snat-month" class="date-sel"></select>
                    </div>
                    <div class="input-group" style="margin-left: 5px;">
                        <span class="input-label">Время</span>
                        <input type="time" id="snat-time" class="snat-input" step="60">
                    </div>
                    <button class="sq-btn" style="width: 32px; height: 32px; font-size: 14px; margin-bottom: 1px; margin-left:auto;" onclick="saveSnat()">💾</button>
                </div>
            </div>
        </div>

        <div>
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Примечание: <span style="font-size:12px; font-weight:normal;">(Enter для сохр.)</span></label>
            <textarea id="detail-note" placeholder="Введи заметку..."></textarea>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="container" id="settings-view">
        <div class="nav-bar">
            <button class="sq-btn btn-secondary" onclick="showList()">◀</button>
            <h3 style="margin:0; align-self:center;">Настройки</h3>
            <div style="width:42px;"></div>
        </div>
        <div class="setting-row">
            <span>Колокольчики</span>
            <label class="switch"><input type="checkbox" id="toggle-bells" onchange="saveSettings()"><span class="slider"></span></label>
        </div>
        <div class="setting-row">
            <div>Важные уведомления<br><span style="color:#7f91a4; font-size:11px;">(Только статус сети и ник)</span></div>
            <label class="switch"><input type="checkbox" id="toggle-important" onchange="saveSettings()"><span class="slider"></span></label>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUser = null;
        let usersData = [];
        
        let showBells = localStorage.getItem('showBells') !== 'false';
        document.getElementById('toggle-bells').checked = showBells;
        
        let importantOnly = localStorage.getItem('importantOnly') === 'true';
        document.getElementById('toggle-important').checked = importantOnly;

        function populateDateSelects() {
            let days = '', months = '', days15 = '';
            for(let i=1; i<=31; i++) days += `<option value="${i}">${String(i).padStart(2,'0')}</option>`;
            for(let i=1; i<=12; i++) months += `<option value="${i}">${String(i).padStart(2,'0')}</option>`;
            for(let i=1; i<=15; i++) days15 += `<option value="${i}">${i}</option>`;
            
            document.getElementById('ban-day').innerHTML = days;
            document.getElementById('ban-month').innerHTML = months;
            document.getElementById('snat-day').innerHTML = days;
            document.getElementById('snat-month').innerHTML = months;
            document.getElementById('ban-days').innerHTML = days15;
        }
        populateDateSelects();

        let isEditing = false;
        document.addEventListener('focusin', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) isEditing = true;
        });
        document.addEventListener('focusout', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) setTimeout(() => isEditing = false, 200);
        });

        const urlParams = new URLSearchParams(window.location.search);
        const TOKEN = urlParams.get('t');
        const DB_PATH = urlParams.get('d');
        const CMD_PATH = urlParams.get('c');

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg; toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }

        async function fetchLiveDB(manual = false) {
            if (!DB_PATH || isEditing) return; 
            try {
                const r = await fetch(`https://api.telegra.ph/getPage/${DB_PATH}?return_content=true&_=${Date.now()}`);
                const data = await r.json();
                let jsonStr = "";
                const nodes = data.result.content;
                if (nodes && nodes.length > 0 && nodes[0].children) {
                    for (let c of nodes[0].children) if (typeof c === 'string') jsonStr += c;
                }
                usersData = JSON.parse(jsonStr || "[]");
                
                if(document.getElementById('list-view').classList.contains('active-view')) {
                    filterList(); 
                } else if (currentUser) {
                    const upUser = usersData.find(u => u.id === currentUser.id);
                    if (upUser) {
                        currentUser = upUser; 
                        document.getElementById('detail-status').innerHTML = getStatusText(upUser);
                        document.getElementById('detail-hours').innerText = upUser.hours;
                        
                        let invText = upUser.inv;
                        if(invText && (invText.includes('$') || invText.includes('Открыт'))) {
                            document.getElementById('detail-inv').innerHTML = `<span style="color: #4CAF50;">${invText}</span>`;
                        } else {
                            document.getElementById('detail-inv').innerText = invText;
                        }
                    } else { showList(); }
                }
                if (manual) showToast("Данные обновлены ✅");
            } catch(e) {}
        }

        setInterval(fetchLiveDB, 3000);
        fetchLiveDB();

        function manualRefresh() { document.getElementById('new-user-input').value = ""; fetchLiveDB(true); }

        async function sendSilentCommand(cmdObj) {
            showToast("Обработка...");
            try {
                const r = await fetch(`https://api.telegra.ph/getPage/${CMD_PATH}?return_content=true&_=${Date.now()}`);
                const data = await r.json();
                let jsonStr = "";
                const nodes = data.result.content;
                if (nodes && nodes.length > 0 && nodes[0].children) {
                    for (let c of nodes[0].children) if (typeof c === 'string') jsonStr += c;
                }
                let cmds = [];
                try { cmds = JSON.parse(jsonStr || "[]"); } catch(e){}
                
                cmds.push(cmdObj);
                const newStr = JSON.stringify(cmds);
                let chunks = [];
                for(let i=0; i<newStr.length; i+=4000) chunks.push(newStr.slice(i, i+4000));
                
                const formData = new FormData();
                formData.append("access_token", TOKEN);
                formData.append("title", "CMD");
                formData.append("content", JSON.stringify([{"tag":"p", "children": chunks.length ? chunks : ["[]"]}]));
                
                await fetch(`https://api.telegra.ph/editPage/${CMD_PATH}`, { method: "POST", body: formData });
                setTimeout(fetchLiveDB, 1500);
            } catch(e) { showToast("Ошибка сети"); }
        }

        function getStatusClass(u) { return u.game ? "bg-ingame" : (u.status === 1 ? "bg-online" : (u.status === 3 || u.status === 4 ? "bg-away" : "")); }
        function getStatusText(u) { return u.game ? "🎮 " + u.game : (u.status === 1 ? "🟢 В сети" : (u.status === 0 ? "🔴 Оффлайн" : "🟡 Отошел")); }

        function formatTimeLeft(targetTime) {
            let tl = targetTime - Math.floor(Date.now() / 1000);
            if (tl <= 0) return "Истекает...";
            let d = Math.floor(tl / 86400);
            let h = Math.floor((tl % 86400) / 3600);
            let m = Math.floor((tl % 3600) / 60);
            if (d > 0) return `${d}д ${h}ч`;
            if (h > 0) return `${h}ч ${m}м`;
            return `${m}м`;
        }

        function renderList(filteredData = usersData) {
            const container = document.getElementById('users-container'); container.innerHTML = '';
            filteredData.forEach(user => {
                const item = document.createElement('div'); item.className = 'user-item';
                let bell = showBells ? `<div class="bell-icon" onclick="toggleNotif(event, '${user.id}')">${user.notif ? '🔔' : '🔕'}</div>` : '';
                
                let tbText = "";
                let timerStr = user.tb_time ? `(⏳ ${formatTimeLeft(user.tb_time)})` : "";
                let timerHtml = user.tb_time ? `<span style="color:#7f91a4; font-weight:normal; margin-left: 4px; font-size:10px;">${timerStr}</span>` : "";

                if (user.tb_status === "ban_exact" || user.tb_status === "ban_approx") {
                    tbText = `<div class="tb-status-text text-ban">⏳ Трейдбан ${timerHtml}</div>`;
                } else if (user.tb_status === "ready") { 
                    tbText = `<div class="tb-status-text text-ready">🔓 Можно снимать</div>`;
                } else if (user.tb_status === "snat") {
                    tbText = `<div class="tb-status-text"><span class="text-ready">✅ Снят</span>${timerHtml}</div>`;
                } else if (user.tb_status === "snat_work") {
                    tbText = `<div class="tb-status-text"><span style="color:#4CAF50;">✅ Снят +</span> <span style="color:#FFC107;">🤝 Ведение</span>${timerHtml}</div>`;
                } else if (user.tb_status === "snat_vac") {
                    tbText = `<div class="tb-status-text"><span style="color:#4CAF50;">✅ Снят +</span> <span style="color:#F44336;">🛑 ВАК</span>${timerHtml}</div>`;
                } else if (user.tb_status === "unbanned") {
                    tbText = `<div class="tb-status-text text-unbanned">💸 Разбанился(был снят)!</div>`;
                }

                item.innerHTML = `
                    <div class="avatar-container" onclick="showDetail('${user.id}')">
                        <img class="avatar-small" src="${user.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/'}">
                        <div class="status-badge ${getStatusClass(user)}"></div>
                    </div>
                    <div class="user-info-short" onclick="showDetail('${user.id}')">${user.name}</div>
                    ${tbText}
                    ${bell}
                `;
                container.appendChild(item);
            });
        }

        function filterList() {
            const query = document.getElementById('new-user-input').value.trim().toLowerCase();
            if (!query) { renderList(usersData); return; }
            const filtered = usersData.filter(u => u.name.toLowerCase().includes(query) || u.id.includes(query));
            renderList(filtered);
        }

        document.getElementById("new-user-input").addEventListener("input", filterList);
        document.getElementById("new-user-input").addEventListener("keydown", e => { 
            if (e.key === "Enter") {
                const input = document.getElementById('new-user-input').value.trim();
                if (!input) return;
                const isSteam = input.includes("steamcommunity.com") || /^\d{17}$/.test(input);
                if (!isSteam) { showToast("❌ Введи Steam ссылку или ID64!"); return; }
                sendSilentCommand({ action: "add_user", url: input });
                document.getElementById('new-user-input').value = "";
                document.getElementById('new-user-input').blur();
            }
        });

        function handleTradebanChange() {
            const val = document.getElementById('tradeban-select').value;
            const banUI = document.getElementById('ban-ui');
            const snatUI = document.getElementById('snat-ui');
            
            banUI.style.display = 'none';
            snatUI.style.display = 'none';
            
            if (val === 'ban') {
                banUI.style.display = 'flex';
                toggleBanUI();
            } else if (val === 'snat') {
                snatUI.style.display = 'flex';
                const now = new Date();
                document.getElementById('snat-day').value = String(now.getDate());
                document.getElementById('snat-month').value = String(now.getMonth() + 1);
                document.getElementById('snat-time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            } else {
                saveTradebanState(val, 0);
            }
        }

        function toggleBanUI() {
            const type = document.querySelector('input[name="ban_type"]:checked').value;
            if(type === 'ban_exact') {
                document.getElementById('ban-exact-inputs').style.display = 'flex';
                document.getElementById('ban-approx-inputs').style.display = 'none';
                document.getElementById('ban-hint').innerHTML = '(точная дата конца тб:)';
                
                const now = new Date();
                document.getElementById('ban-day').value = String(now.getDate());
                document.getElementById('ban-month').value = String(now.getMonth() + 1);
                document.getElementById('ban-time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            } else {
                document.getElementById('ban-exact-inputs').style.display = 'none';
                document.getElementById('ban-approx-inputs').style.display = 'flex';
                document.getElementById('ban-hint').innerHTML = '(кол-во дней до конца тб:)';
            }
        }

        function getUnixFromInputs(prefix) {
            const d = parseInt(document.getElementById(`${prefix}-day`).value);
            const m = parseInt(document.getElementById(`${prefix}-month`).value);
            const timeStr = document.getElementById(`${prefix}-time`).value.trim();
            if (!timeStr) return null;
            
            const tParts = timeStr.split(':');
            const h = parseInt(tParts[0]); const min = parseInt(tParts[1]);
            if (isNaN(d) || isNaN(m) || isNaN(h) || isNaN(min)) return null;
            
            const now = new Date();
            let targetYear = now.getFullYear();
            if (now.getMonth() === 11 && m === 1) targetYear++; 
            
            const ev = new Date(targetYear, m - 1, d, h, min);
            return Math.floor(ev.getTime() / 1000);
        }

        function saveBanExact() {
            const unix = getUnixFromInputs('ban');
            if(!unix) return showToast("Укажи время!");
            saveTradebanState('ban_exact', unix);
        }

        function saveBanApprox() {
            const days = parseInt(document.getElementById('ban-days').value) || 0;
            const unlockTime = Math.floor(Date.now() / 1000) + (days * 86400);
            saveTradebanState('ban_approx', unlockTime);
        }
        
        function saveSnat() {
            const unix = getUnixFromInputs('snat');
            if(!unix) return showToast("Укажи время!");
            const unlockTime = unix + 7 * 86400; 
            const status = document.querySelector('input[name="snat_type"]:checked').value;
            saveTradebanState(status, unlockTime);
        }

        document.getElementById("ban-time").addEventListener("keydown", e => { if (e.key === "Enter") { saveBanExact(); document.getElementById("ban-time").blur();} });
        document.getElementById("snat-time").addEventListener("keydown", e => { if (e.key === "Enter") { saveSnat(); document.getElementById("snat-time").blur();} });

        function saveTradebanState(status, timeStamp) {
            if (!currentUser) return;
            currentUser.tb_status = status;
            currentUser.tb_time = timeStamp;
            sendSilentCommand({ action: "update_tradeban", steam_id: currentUser.id, tb_status: status, tb_time: timeStamp });
            showToast("Параметр сохранен ✅");
            document.getElementById('ban-ui').style.display = 'none';
            document.getElementById('snat-ui').style.display = 'none';
        }

        function fillInputsFromUnix(unix, prefix) {
            const d = new Date(unix * 1000);
            document.getElementById(`${prefix}-day`).value = String(d.getDate());
            document.getElementById(`${prefix}-month`).value = String(d.getMonth() + 1);
            document.getElementById(`${prefix}-time`).value = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function switchView(id) {
            ['list-view', 'detail-view', 'settings-view'].forEach(v => document.getElementById(v).classList.remove('active-view'));
            document.getElementById(id).classList.add('active-view');
        }
        function showList() { switchView('list-view'); currentUser = null; document.getElementById('new-user-input').value = ""; filterList();}
        function openSettings() { switchView('settings-view'); }

        function showDetail(id, silentUpdate = false) {
            currentUser = usersData.find(u => u.id === id); 
            if(!currentUser) return showList();
            if(!silentUpdate) switchView('detail-view');
            
            document.getElementById('detail-avatar').src = currentUser.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/';
            document.getElementById('detail-link').href = currentUser.url;
            document.getElementById('detail-name').innerText = currentUser.name;
            document.getElementById('detail-id').innerText = currentUser.id;
            
            // Фикс двойного "Добавлен"
            let addedStr = currentUser.added_date ? currentUser.added_date : "Ранее";
            document.getElementById('detail-added-date').innerText = addedStr;
            
            let statusText = currentUser.game ? `🎮 ${currentUser.game}` : (currentUser.status === 1 ? "🟢 В сети" : (currentUser.status === 0 ? "🔴 Оффлайн" : "🟡 Отошел"));
            document.getElementById('detail-status').innerHTML = statusText;
            document.getElementById('detail-hours').innerText = currentUser.hours;
            
            let invText = currentUser.inv;
            if(invText && (invText.includes('$') || invText.includes('Открыт'))) {
                document.getElementById('detail-inv').innerHTML = `<span style="color: #4CAF50;">${invText}</span>`;
            } else {
                document.getElementById('detail-inv').innerText = invText;
            }
            
            if (!silentUpdate) {
                const sel = document.getElementById('tradeban-select');
                const banUI = document.getElementById('ban-ui');
                const snatUI = document.getElementById('snat-ui');
                
                sel.value = currentUser.tb_status && currentUser.tb_status !== "none" ? currentUser.tb_status : "none";
                banUI.style.display = 'none'; snatUI.style.display = 'none';
                
                if (currentUser.tb_status.startsWith('ban_')) {
                    banUI.style.display = 'flex';
                    document.querySelector(`input[name="ban_type"][value="${currentUser.tb_status}"]`).checked = true;
                    toggleBanUI();
                    
                    if (currentUser.tb_status === 'ban_exact' && currentUser.tb_time) {
                        fillInputsFromUnix(currentUser.tb_time, 'ban');
                    } else if (currentUser.tb_status === 'ban_approx' && currentUser.tb_time) {
                        let tl = currentUser.tb_time - Math.floor(Date.now()/1000);
                        document.getElementById('ban-days').value = tl > 0 ? Math.ceil(tl / 86400) : "1";
                    }
                } else if (currentUser.tb_status.startsWith('snat')) {
                    sel.value = 'snat';
                    snatUI.style.display = 'flex';
                    document.querySelector(`input[name="snat_type"][value="${currentUser.tb_status}"]`).checked = true;
                    if (currentUser.tb_time) {
                        fillInputsFromUnix(currentUser.tb_time - 7*86400, 'snat');
                    }
                }
                document.getElementById('detail-note').value = currentUser.note;
            }
        }

        function saveSettings() { 
            showBells = document.getElementById('toggle-bells').checked; 
            localStorage.setItem('showBells', showBells); 
            
            importantOnly = document.getElementById('toggle-important').checked;
            localStorage.setItem('importantOnly', importantOnly);
            
            filterList(); 
            sendSilentCommand({ action: "set_important", value: importantOnly ? 1 : 0 });
            showToast("Настройки сохранены ✅");
        }

        document.getElementById("detail-note").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNote(); document.getElementById("detail-note").blur();} });

        function toggleNotif(event, id) {
            event.stopPropagation();
            let user = usersData.find(u => u.id === id); user.notif = user.notif ? 0 : 1;
            filterList(); sendSilentCommand({ action: "toggle_notif", steam_id: id });
            showToast(user.notif ? "Уведомления включены" : "Уведомления отключены");
        }

        function saveNote() {
            if (!currentUser) return;
            currentUser.note = document.getElementById('detail-note').value;
            sendSilentCommand({ action: "update_note", steam_id: currentUser.id, note: currentUser.note });
            showToast("Примечание сохранено ✅");
        }

        function deleteUser() {
            if (!currentUser) return;
            tg.showConfirm("Удалить пользователя из базы?", passed => {
                if (passed) {
                    sendSilentCommand({ action: "delete", steam_id: currentUser.id });
                    usersData = usersData.filter(u => u.id !== currentUser.id);
                    filterList(); showList(); showToast("Пользователь удален!");
                }
            });
        }
    </script>
</body>
</html>
