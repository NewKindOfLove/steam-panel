<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container { padding: 15px; }
        
        /* Список пользователей */
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-item {
            display: flex; align-items: center; padding: 10px;
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            border-radius: 10px; cursor: pointer;
        }
        .user-item:active { opacity: 0.7; }
        .avatar-small { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .user-info-short { flex-grow: 1; }
        .user-name { font-weight: bold; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #4CAF50; display: inline-block; }
        .status-offline { display: none; } /* Скрываем зеленый кружок, если оффлайн */
        
        /* Детальная карточка */
        #detail-view { display: none; }
        .card-header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 20px; }
        .avatar-big { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 10px; border: 3px solid var(--tg-theme-button-color, #5288c1); object-fit: cover;}
        .card-name a { color: var(--tg-theme-link-color, #6ab2f2); text-decoration: none; font-size: 22px; font-weight: bold; }
        .card-stats {
            background-color: var(--tg-theme-secondary-bg-color, #242f3d);
            padding: 15px; border-radius: 10px; margin-bottom: 15px;
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-value { font-weight: bold; }
        
        /* Текстовая область и кнопка */
        textarea {
            width: 100%; box-sizing: border-box; padding: 10px;
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #7f91a4);
            border-radius: 8px; min-height: 80px; resize: none; font-family: inherit; margin-bottom: 15px;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background-color: var(--tg-theme-button-color, #5288c1);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button.delete-btn { background-color: #e53935; margin-top: 10px; }
        button:active { opacity: 0.8; }
        .back-btn { margin-bottom: 15px; background-color: transparent; border: 1px solid var(--tg-theme-button-color); color: var(--tg-theme-button-color); }
    </style>
</head>
<body>
    <div class="container" id="list-view">
        <div class="user-list" id="users-container">
            <!-- Пользователи будут загружаться сюда -->
        </div>
    </div>

    <div class="container" id="detail-view">
        <button class="back-btn" onclick="showList()">🔙 Назад к списку</button>
        <div class="card-header">
            <img id="detail-avatar" class="avatar-big" src="" alt="Avatar">
            <div class="card-name"><a id="detail-link" href="#" target="_blank">Имя</a></div>
            <div style="font-size: 14px; color: var(--tg-theme-hint-color); margin-top: 5px;" id="detail-id"></div>
        </div>
        
        <div class="card-stats">
            <div class="stat-row"><span>Статус:</span> <span class="stat-value" id="detail-status"></span></div>
            <div class="stat-row"><span>Часов в CS:</span> <span class="stat-value" id="detail-hours"></span></div>
            <div class="stat-row"><span>Инвентарь:</span> <span class="stat-value" id="detail-inv"></span></div>
        </div>

        <div>
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Примечание:</label>
            <textarea id="detail-note" placeholder="Введи заметку..."></textarea>
            <button onclick="saveNote()">💾 Сохранить примечание</button>
            <button class="delete-btn" onclick="deleteUser()">❌ Удалить из базы</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUser = null;
        let usersData = [];

        // Получаем зашифрованные данные из ссылки, которую генерирует питон
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('d');
        
        if (encodedData) {
            try {
                const decoded = decodeURIComponent(escape(window.atob(encodedData)));
                usersData = JSON.parse(decoded);
                renderList();
            } catch (e) {
                document.getElementById('users-container').innerHTML = "Ошибка загрузки данных.";
            }
        } else {
            document.getElementById('users-container').innerHTML = "База пуста или данные не переданы.";
        }

        function getStatusText(user) {
            if (user.game) return "🎮 " + user.game;
            if (user.status === 1) return "В сети";
            if (user.status === 0) return "Оффлайн";
            return "Отошел";
        }

        function renderList() {
            const container = document.getElementById('users-container');
            container.innerHTML = '';
            
            usersData.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-item';
                
                // Если юзер в сети (статус 1) или в игре, показываем зеленый кружок
                const isOnline = user.status === 1 || user.game !== "";
                const dotClass = isOnline ? "status-dot" : "status-dot status-offline";
                
                item.innerHTML = `
                    <img class="avatar-small" src="${user.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/'}">
                    <div class="user-info-short">
                        <div class="user-name">
                            ${user.name} <span class="${dotClass}"></span>
                        </div>
                        <div style="font-size: 12px; color: var(--tg-theme-hint-color);">
                            ${getStatusText(user)}
                        </div>
                    </div>
                `;
                item.onclick = () => showDetail(user);
                container.appendChild(item);
            });
        }

        function showDetail(user) {
            currentUser = user;
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            
            document.getElementById('detail-avatar').src = user.avatar || 'https://steamuserimages-a.akamaihd.net/ugc/885384897182110030/F095539864AC9E94AE5236E04C8CA7C2725BCEEA/';
            document.getElementById('detail-link').innerText = user.name;
            document.getElementById('detail-link').href = user.url;
            document.getElementById('detail-id').innerText = "ID: " + user.id;
            
            document.getElementById('detail-status').innerText = getStatusText(user);
            document.getElementById('detail-hours').innerText = user.hours;
            document.getElementById('detail-inv').innerText = user.inv;
            document.getElementById('detail-note').value = user.note;
        }

        function showList() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('list-view').style.display = 'block';
            currentUser = null;
        }

        // Отправка данных обратно в бота (через Keyboard Button WebApp)
        function saveNote() {
            if (!currentUser) return;
            const newNote = document.getElementById('detail-note').value;
            const dataToBot = JSON.stringify({
                action: "update_note",
                steam_id: currentUser.id,
                note: newNote
            });
            tg.sendData(dataToBot);
            tg.close(); // Закрываем WebApp после сохранения
        }

        function deleteUser() {
            if (!currentUser) return;
            if(confirm("Точно удалить пользователя?")) {
                const dataToBot = JSON.stringify({
                    action: "delete",
                    steam_id: currentUser.id
                });
                tg.sendData(dataToBot);
                tg.close();
            }
        }
    </script>
</body>
</html>
